version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: swasthya_postgres
    environment:
      POSTGRES_DB: swasthya_db
      POSTGRES_USER: swasthya_user
      POSTGRES_PASSWORD: swasthya_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: swasthya_backend
    environment:
      DATABASE_URL: postgresql://swasthya_user:swasthya_password_2026@postgres:5432/swasthya_db
      SECRET_KEY: swasthya-setu-ai-super-secret-key-change-in-production-2026
      AI_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: swasthya_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: swasthya_nginx
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
